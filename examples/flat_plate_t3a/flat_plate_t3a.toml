# ERCOFTAC T3A-like bypass transition — Phase 59 (P59-d, #185;
# formerly examples/transition/flat_plate_t3a.jl, then the `flat_plate` run
# type; on the model since ONE-l, #475). A spatially developing
# zero-pressure-gradient flat-plate boundary layer under free-stream
# turbulence of Tu = 3.3 % (the T3A level of Roach & Brierley 1992), in
# units of the inflow displacement thickness δ*₀ = 1 m and U∞ = 1 m/s,
# Re_δ*₀ = 300 (Re_x = 3.0e4 at the inflow):
#
#   * an x-periodic box 600 × 36 × 24 δ*₀, 576 × 64 × 96 cells
#     (Δx = 1.04, Δy = 0.56, Δz = 0.25 δ*₀; coarser grids over-predict the
#     turbulent c_f, see docs/src/theory/transition.md); the plate spans
#     Re_x = 3.0e4 → 1.9e5, the last 80 δ*₀ are the [fringe] that relaxes
#     the outflow to the Blasius inflow and carries the free-stream
#     turbulence in;
#   * a no-slip plate, the free-stream top of the growing layer, RK3 at
#     dt = 1 δ*₀/U, no SGS model (a coarse DNS);
#   * free-stream turbulence: 200 random Fourier modes, von Kármán spectrum,
#     L11 = 10 δ*₀, kept out of the inflow layer below 2 δ₉₉ in the fringe;
#   * 1500 steps (2.5 flow-through times); the output's records are means
#     over 300 steps, the statistics of the analysis the last two (600 steps).
#
# About 2.2 h on 8 threads (5.4 s per step at the run type's measurement):
#
#   JULIA_NUM_THREADS=8 julia --project -m Aeolus run examples/flat_plate_t3a/flat_plate_t3a.toml
#   julia --project=. examples/flat_plate_t3a/plot_flat_plate_t3a.jl runs/<date>_flat_plate_t3a_<id>
#
# plot_flat_plate_t3a.jl: the onset (x, Re_x, Re_θ against Mayle 1991 and
# Abu-Ghannam & Shaw 1980), the downstream c_f against 0.0576 Re_x^(-1/5),
# the shape factor and the free-stream Tu.

schema_version = 2

[run]
name = "flat_plate_t3a"

[timestep]
scheme = "rk3"

[time]
dt = 1.0
duration = 1500.0

[grid]
size = [576, 64, 96]
extent = [600.0, 36.0, 24.0]

[boundaries]
x = "periodic"
y = "periodic"
z = "noslip"                    # the plate; [fringe] sets the free-stream top

[dynamics]
nu = 0.0033333333333333335      # U∞ δ*₀ / Re_δ*₀
theta0 = 0.0                    # no buoyancy

[sgs]
model = "none"

[fringe]
profile = "blasius"
inflow_reynolds = 300.0
velocity = 1.0
length = 80.0
rise = 24.0
fall = 16.0
lambda_max = 0.4
top = "freestream"
tu = 0.033
length_scale = 10.0
modes = 200
seed = 1
kappa_cells = 3.0
damping_height = 2.0

[output]
variables = ["skin_friction", "u", "u_squared"]
averaging = "mean"
cadence = 300.0
series_cadence = 300.0

[checks]
finite = { required = true }

[test]
overrides = ["grid.size=[96,8,16]", "time.duration=6.0", "output.cadence=3.0"]
