# Convective boundary layer, DNS against LES (#503): the reference DNS.
#
# A floor heated by a constant kinematic flux Q under a linearly stratified
# atmosphere (no mean wind), after Mellado (2012, J. Fluid Mech. 712,
# 324-360) and Garcia & Mellado (2014, J. Atmos. Sci. 71, 1935-1955): the
# daytime boundary layer of a city or regional run, with the entrainment
# zone at its top. Periodic in x and y, no-slip walls in z (the lid sits in
# nearly quiescent stratified air), θ₀ = 300 K, Q = 0.1 K m/s (surface
# buoyancy flux B₀ = g Q / θ₀ = 3.27e-3 m² s⁻³), lapse rate Γ = 3 K/km
# (N² = g Γ / θ₀ = 9.81e-5 s⁻²). Prandtl number 1 (θ diffuses with ν).
#
# The Reynolds number of Mellado (2012), Re₀ = B₀ / (ν N²) = 33.3 / ν:
# here ν = 1.333 m²/s, Re₀ = 25. The Kolmogorov scale in the mixed layer,
# η = (ν³ / ε)^(1/4) with ε ≈ 0.5 B₀, is about 6 m; the grid is Δx = 10 m
# horizontally and 2.5 m at the floor, stretched to 10 m. After 2 h the
# boundary layer is about 750 m deep (z_i ≈ 1.1 (2 B₀ t / N²)^(1/2)).
# Other Reynolds numbers: --set dynamics.nu=… with the grid scaled with η
# (η ∝ ν^(3/4)).
#
# The output: every 10 min the profiles (θ, the total heat flux, the w
# variance, the resolved TKE) and the 3-D w and
# θ; every minute the domain means. analysis.jl and plots.jl in this
# directory read the run folders.
#
#   julia --project -t 12 -m Aeolus run examples/cbl_dns_les/dns.toml

schema_version = 2

[run]
name = "cbl_dns"
seed = 1

[grid]
size = [256, 256, 189]
extent = [2560.0, 2560.0, 1600.0]
stretching = "surface_refined"
dz_surface = 2.5
z_uniform = 25.0
stretching_parameter = 1.03
dz_max = 10.0

[dynamics]
theta0 = 300.0
g = 9.81
nu = 1.333

[boundaries]
x = "periodic"
y = "periodic"
z = "noslip"
theta_top = "initial_gradient"

[sgs]
model = "none"

[surface_theta_flux]
bottom = 0.1

[sponge]
alpha_max = 0.01
z_start = 1300.0

[initial]
theta = { kind = "mixed_layer_lapse", value = 300.0, z_i = 0.0, lapse = 0.003 }
perturbation_amplitude = 0.1
perturbation_depth = 50.0

[timestep]
scheme = "rk3"

[time]
dt = "adaptive"
cfl = 0.5
dt_max = 5.0
duration = 7200.0

[output]
# (dissipation needs a uniform grid; the buoyancy flux is (g/θ₀) × the total
# heat flux, which analysis.jl computes from heat_flux_profile, the surface
# flux included)
variables = ["theta_profile", "heat_flux_profile", "w_variance_profile", "resolved_tke_profile",
             "w", "theta", "kinetic_energy"]
averaging = "instant"
cadence = 600.0
series_cadence = 60.0

[logging]
diagnostics_cadence = 60.0

[checks]
finite = { required = true }
energy_closure = { required = false }

[fftw]
planner = "estimate"

# The smoke size of this file for the round-trip coverage suite (test/config_roundtrip.jl,
# CFG-i #364): ignored by the loader, not part of the resolved config.
[test]
overrides = [
    "grid.size=[16,16,24]",
    "grid.stretching=\"uniform\"",
    "time.duration=\"none\"",
    "time.nsteps=5",
]
