# An open box over Lindenberg (52.21 N, 14.12 E) driven by ERA5 (CFG-h,
# #363): 3200 × 3200 × 1600 m on 16³, open lateral faces fed by the ERA5
# boundary planes of 2019-06-29 00-12 UTC (hourly records, blended
# linearly in time), free-slip walls in z, initial u, v, θ, qv from the
# ERA5 profiles at the domain centre at 00 UTC. A smoke run of the data
# path, not a boundary-layer simulation (no surface fluxes or radiation).
#
# The dynamic driver (input/lindenberg_era5_dynamic.nc) is made by
# AeolusPrep.jl from its ERA5 sample (ERA5 at 52.2085 N, 14.118 E,
# ±0.5° centred differences, pressure levels; its recipes.toml):
#
#   julia --project -m AeolusPrep dynamic --from-era5 \
#       data/era5/era5_lindenberg_20190629_pl.nc data/era5/era5_lindenberg_20190629_sfc.nc \
#       --config <Aeolus>/examples/configs/lindenberg_era5.toml --lat 52.2085 --lon 14.118
#   julia --project -m Aeolus run examples/configs/lindenberg_era5.toml

schema_version = 2
dynamic_driver = "input/lindenberg_era5_dynamic.nc"

[run]
name = "lindenberg_era5"
seed = 1

[grid]
size = [16, 16, 16]
extent = [3200.0, 3200.0, 1600.0]

[dynamics]
theta0 = 300.0
g = 9.80665
moisture = true

[boundaries]
x = "open"
y = "open"
z = "free_slip"

[sgs]
closure = "smagorinsky"
c_s = 0.17

[initial]

[time]
scheme = "rk3"
dt = 2.0
duration = 600.0

[logging]
diagnostics_cadence = 60.0

[checks]                        # results.toml; aeolus run exits with 3 if a required check fails
finite = { required = true }    # the sanity check: no NaN or Inf in the state

[test]
overrides = [
    "time.duration=\"none\"",
    "time.nsteps=10",
]
