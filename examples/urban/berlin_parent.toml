# The Berlin nest parent alone (N-parent-e #259; NEST-p3 #483: a domain of the
# model's core): 24 h, 06 to 06 LT, of the 6 km × 6 km × 3 km parent around
# Alexanderplatz on 29/30 June 2019 (the Lindenberg sounding of #247), every
# forcing on: the tiled urban surface (#249), the column radiation, the
# geostrophic pressure gradient, θ/qv nudging, θ damping and the
# fixed-gradient top (#248, #254), the TKE closure on the stretched grid.
# 192 × 192 × 53 cells, Δx = 31.25 m, Δz = 25 m to 500 m, then × 1.08 per
# level up to 100 m. See docs/src/design/berlin_parent.md.
#
#   julia --project -m Aeolus run examples/urban/berlin_parent.toml
#
# The subsidence sensitivity run: --set large_scale_forcing.divergence=3e-6
# (diverges during the day, #312). The coarse grid: berlin_parent_coarse.toml.
# The run folder's output/ holds parent.nc (the profiles and the budgets) and
# results.toml; berlin_parent_figures.jl draws the figures from them.

schema_version = 2

# The domain's input drivers (top-level keys of a one-domain config): its land-use
# tiles (AeolusPrep.jl, `aeolusprep static`) and the sounding driver
static_driver = "input/berlin_summer_parent_static.nc"
dynamic_driver = "input/berlin_20190629_dynamic.nc"

[run]
# the case name: part of the run folder name runs/<date>_<name>_<id>
name = "parent"
# the seed of the run's random numbers (the initial θ noise)
seed = 259

[checkpoint]
every_seconds = inf
keep = 2

[output]
# the profiles of the boundary layer and the budgets of its heat and water, every 30 min
# (berlin_parent_figures.jl and berlin_parent_lindenberg_check.jl read them)
path = "none"
netcdf = "parent.nc"
variables = ["theta_profile", "qv_profile", "u_profile", "v_profile", "heat_flux_profile", "budget_energy", "budget_water"]
cadence = 1800.0

[time]
# 24 h, 06 to 06 LT, adaptive steps (the advective Courant number 0.9, at most 10 s)
dt = "adaptive"
cfl = 0.9
dt_max = 10.0
duration = 86400.0

[grid]
size = [192, 192, 53]
extent = [6000.0, 6000.0, 3000.0]
halo = [2, 2, 2]
# the corner, so that the site (at its own corner, 0, 0) is centred in the parent
origin = [-2500.0, -2500.0]
# Δz = 25 m (the site's 6.25 m × 4) up to 500 m, then × 1.08 per level up to 100 m (#151)
stretching = "surface_refined"
dz_surface = 25.0
z_uniform = 500.0
stretching_parameter = 1.08
dz_max = 100.0

[core]
model = "boussinesq"

[timestep]
# SSP-RK3 at the root's adaptive step ([time] cfl, dt_max)
scheme = "rk3"

[dynamics]
nu = 0.0
theta0 = 293.0
g = 9.81
moisture = true

[boundaries]
x = "periodic"
y = "periodic"
z = "free_slip"
# the fixed initial gradient of θ at the top (#254)
theta_top = "initial_gradient"

[initial]
# u, v: the geostrophic wind of [large_scale_forcing]
u = {kind = "geostrophic"}
v = {kind = "geostrophic"}
# uniform θ noise of ±0.2 K in the lowest 100 m ([run] seed)
perturbation_amplitude = 0.4
perturbation_depth = 100.0

[coriolis]
f = 0.0001

[sponge]
# the velocity sponge over the top 25 %
alpha_max = 0.01
z_start = 2250.0

[sgs]
# Deardorff TKE, l capped at κz (the wall distance of the grid), the surface value from the tiles' u*
model = "tke"
e_min = 0.0001
wall_cap = true
wall_cap_top = false
surface_value = true

[surface]
# the tiled urban mosaic of the static driver (#249)
model = "tiles"
period = 60.0
u_min = 0.5

[radiation]
# two-stream radiation of the plane-mean column, the sun of the site's date, place and clock
scheme = "mean_column"
period = 600.0
humid = "midlatitude_summer"
latitude = 52.522
longitude = 13.41
elevation = 34.0
date = 2019-06-29
utc_offset = 2.0
start_hour = 6.0

[large_scale_forcing]
# the sounding's wind above z_g (1.2 × its largest parcel z_i) as the geostrophic wind,
# θ and qv nudged toward the sounding above the tracked boundary layer (τ = 6 h),
# θ damped toward the sounding over the top 25 %
u_g = "sounding"
v_g = "sounding"
sounding_nudging_tau = 21600.0
damping_rate = 0.01
damping_target = "sounding"

[nesting]
# budgets across the nest (read from the root)
budget_exchange = "exchange_term"

[test]
overrides = [
    "grid.size=[24, 24, 38]",
    "grid.dz_surface=50.0",
    "static_driver=\"input/berlin_parent_coarse_static.nc\"",
    "time.duration=180.0",
    "output.cadence=60.0",
]
