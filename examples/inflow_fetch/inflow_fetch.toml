# The development length behind a synthetic inflow — N-inflow-d (#266;
# formerly examples/nesting/inflow_fetch.jl). How far into an
# open-boundary child is the inflow turbulence still out of equilibrium,
# and how much does the generator shorten that distance?
#
#   precursor  the periodic, neutral, wall-modelled half channel of P54-d
#              (δ = u* = 1, z0 = 1e-4 δ, StaticSmagorinsky(0.1)) on
#              5δ × 2.5δ × δ at the parent resolution (24 × 12 × 16): the
#              statistics source and the mean inflow profile
#   reference  the same periodic channel on the child grid (48 × 24 × 16)
#   child      the channel opened in x, refine 2 horizontally, 15δ long
#              (144 × 24 × 16), spanwise periodic, fed by: off (the mean
#              profile only), df (the digital filter, Xie & Castro 2008,
#              precursor statistics), fsd (FreeStreamInflow) and df_same
#              (the digital filter with the reference's statistics and mean)
#
# About 11 min on one core.
#
#   julia --project -m Aeolus run examples/inflow_fetch/inflow_fetch.toml
#   julia --project=. examples/inflow_fetch/plot_inflow_fetch.jl runs/<date>_inflow_fetch_<id>
#
# results.toml: per run the development lengths (10 %, 20 %) at 0.2δ and
# 0.5δ against its own source and the reference, the ratios at
# x = 1, 3, 5, 10, 14δ, the bulk ratio and the extra pressure gradient.

schema_version = 2

[run]
legacy = "inflow_fetch"
name = "inflow_fetch"

[channel]
width = 2.5
precursor_length = 5.0

[precursor]
size = [24, 12, 16]
t_spin = 20.0
t_avg = 10.0
seed = 1

[reference]
size = [48, 24, 16]
seed = 2

[child]
size = [144, 24, 16]
length = 15.0
t_spin = 2.0
t_avg = 10.0
sample_every = 4
lateral = "periodic"
runs = ["off", "df", "fsd", "df_same"]
heights = [0.2, 0.5]

[test]
overrides = ["precursor.size=[12,6,8]", "reference.size=[24,12,8]", "child.size=[24,12,8]", "child.length=5.0",
             "precursor.t_spin=0.5", "precursor.t_avg=0.5", "child.t_spin=0.2", "child.t_avg=0.5",
             "child.runs=[\"off\",\"df\"]"]
