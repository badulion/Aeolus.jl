# Inflow statistics of a convective Aeolus parent — N-inflow-b (#258;
# formerly examples/nesting/cbl_inflow_statistics.jl). The convective
# boundary layer of examples/sgs/configs/cbl_tke.toml (64³, 2 h) is the
# parent: over the last 30 min every step is folded into a
# ParentResolvedStatistics (τ_avg = 600 s, whole plane, west face) in
# scale-gap mode for a child refined (2, 2, 4) — the Berlin nest — and
# results.toml [inflow] holds the boundary statistics per level, split into
# the parent's resolved stress (what the interpolated boundary values carry)
# and what the generator must add (SGS + the band k_c < k ≤ 2k_c,
# wavelengths 100–200 m at Δx = 50 m).
#
#   julia --project -m Aeolus run examples/nesting/configs/cbl_inflow_statistics.toml
#   julia --project=. examples/nesting/report_cbl_inflow_statistics.jl runs/<date>_cbl_inflow_statistics_<id>

schema_version = 2

[run]
legacy = "cbl"
name = "cbl_inflow_statistics"
seed = 1

[grid]
n = 64
spacing = 50.0
dz = 25.0

[cbl]
heat_flux = 0.1
z_i0 = 800.0
lapse = 0.003
theta0 = 300.0
end_time = 7200.0
average = 1800.0

[inflow_statistics]
enabled = true
tau_avg = 600.0
refine = [2, 2, 4]
depth = 500.0

[test]
overrides = ["grid.n=12", "grid.spacing=100.0", "grid.dz=100.0", "cbl.end_time=120.0", "cbl.average=60.0",
             "cbl.z_i0=600.0", "inflow_statistics.depth=400.0"]
