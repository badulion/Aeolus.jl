# The surface-mounted cube of surface_mounted_cube.toml under the three SGS
# closures — Era VI, P56-e (#192): Smagorinsky (C_s = 0.1), the Deardorff
# TKE closure and the Reynolds-stress closure (both with the wall cap
# κ·wall distance and Moeng's factor at the first level). About 18, 22 and
# 80 min on one core.
#
#   julia --project -m Aeolus run examples/sgs/configs/surface_mounted_cube_closures.toml              # all three
#   julia --project -m Aeolus run examples/sgs/configs/surface_mounted_cube_closures.toml --member tke  # one
#   julia --project=. examples/sgs/plot_surface_mounted_cube.jl runs/<date>_surface_mounted_cube_*

schema_version = 2

[run]
legacy = "obstacle_channel"
name = "surface_mounted_cube"
seed = 1993

# FFTW's default MEASURE planner picks its plans by timing them, so two runs
# of this config could take different plans and, the flow being chaotic,
# end at different x_R (measured: Smagorinsky 1.83 and 1.91, TKE 1.64 and
# 1.54, from two MEASURE runs of the same code). ESTIMATE plans the same in
# every process: a rerun reproduces the run bit for bit.
[fftw]
planner = "estimate"

[grid]
cells_per_h = 16
extent = [10.0, 6.0, 2.0]

[flow]
re_h = 40000.0
kp = 2.0
ki = 0.5
noise = 0.1

[sgs]
closure = "smagorinsky"
c_s = 0.1

[obstacles]
static = "input/surface_mounted_cube_static.nc"
floor_cells = 1

[preprocess]
obstacles = "input/surface_mounted_cube.geojson"

[stepper]
cfl = 0.4
t_spin = 30.0
t_avg = 30.0

[sweep]
axis = [ { key = "sgs.closure", values = ["smagorinsky", "tke", "rsm"] } ]

[test]
overrides = ["stepper.t_spin=0.03", "stepper.t_avg=0.03"]
member = "rsm"
