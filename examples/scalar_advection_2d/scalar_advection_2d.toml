# Passive scalar advection in a prescribed 2-D solid-body rotation
# (formerly examples/scalar_advection_2d.jl, the Phase 0 end-to-end check):
# the mesh, fields, halo fill, the first-order upwind kernel and SSP-RK3.
# A Gaussian blob at (0.25, 0), σ = 0.08, on [-½, ½]² × 1 cell (128 × 128),
# is carried once around the origin (ω = 2π, one revolution per unit time)
# at CFL 0.4; mass is conserved to round-off, upwind diffusion lowers the
# peak, and the peak returns near its start.
#
#   julia --project -m Aeolus run examples/scalar_advection_2d/scalar_advection_2d.toml
#
# results.toml in the run folder's output/: t, mass, max (every nsteps ÷ 8
# steps), peak_x, peak_y.

schema_version = 2

[run]
legacy = "advection"
name = "scalar_advection_2d"

[grid]
size = [128, 128, 1]
extent = [1.0, 1.0, 1.0]
origin = [-0.5, -0.5, 0.0]
halo = [2, 2, 2]

[flow]
kind = "solid_body_rotation"
omega = 6.283185307179586       # 2π: one revolution per unit time
center = [0.0, 0.0]

[scalar]
kind = "gaussian"
center = [0.25, 0.0]
sigma = 0.08

[advection]
scheme = "upwind"

[stepper]
cfl = 0.4
end_time = 1.0

[diagnostics]
records = 8

[test]
overrides = ["grid.size=[32,32,1]", "stepper.end_time=0.1"]
