# ParisFog, 14–15 November 2011 — radiation fog with droplet feedback (Phase 44, #9)
#
# The 1-D RadiationFog column for the SIRTA radiation fog of Mazoyer et
# al. (2017, ACP 17, 13017), 14 h from 23:20 UTC. Three runs: the
# reference, the droplets transparent to radiation (no droplet-radiative
# feedback), and the sun switched off.
#
#   julia --project -m Aeolus run examples/validation/configs/parisfog_2011.toml
#   julia --project examples/validation/parisfog_2011_radiation_fog.jl [runs-root]   # life cycle + figures

[run]
driver = "column"
name = "parisfog_2011"

[column]
case = "parisfog_2011"

[fog_sounding]
duration = 50400.0              # 14 h

[[sweep.member]]
label = "reference"

[[sweep.member]]
label = "no_feedback"
fog = { droplet_feedback = false }

[[sweep.member]]
label = "no_sun"
fog = { shortwave = false }

# The smoke size of this file for the round-trip coverage suite (test/config_roundtrip.jl,
# CFG-i #364): ignored by the loader, not part of the resolved config. Paths resolve
# against this file's directory.
[test]
overrides = [
    "fog_sounding.duration=10.0",
]
member = "reference"
