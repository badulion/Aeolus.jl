# DYCOMS-II RF01 — cloud-top radiative cooling (Stevens et al. 2005, MWR 133, 1443)
#
# The RF01 sounding (Table 1) in a single column — 5 m layers to 1.5 km,
# then 40 stretched layers to 40 km — saturation-adjusted, and one
# longwave solve with the Era III stack (correlated-k gas optics, Mie
# cloud optics, two-stream with the linear-in-τ source), compared with
# the net flux the intercomparison prescribes:
#   F_rad(z) = F0 exp(-Q(z, ztop)) + F1 exp(-Q(0, z)), F0 = 70, F1 = 22 W/m², κ = 85 m²/kg.
#
#   julia --project=. examples/validation/dycoms_rf01_radiation.jl
#   julia --project -m Aeolus run examples/validation/configs/dycoms_rf01.toml

schema_version = 2

[run]
legacy = "column"
name = "dycoms_rf01"

[column]
case = "dycoms_rf01"

[dycoms_rf01]
zi = 840.0
psfc = 101780.0
sst = 292.5
qt_bl = 9.0e-3
qt_ft = 1.5e-3
thl_bl = 289.0
reff = 10.0
f0 = 70.0
f1 = 22.0
kappa = 85.0
ngpt_per_band = 4
sfc_emissivity = 0.98

# The smoke size of this file for the round-trip coverage suite (test/config_roundtrip.jl,
# CFG-i #364): ignored by the loader, not part of the resolved config. Paths resolve
# against this file's directory.
[test]
overrides = []                  # already a smoke run
