# Patchy surface heating — resolved LES against tiled aggregation (Phase 53, #43)
#
# A convective boundary layer over strips of hot (310 K) and cool (300 K)
# ground, 50 % each, z0 = 0.1 m, z0h = z0/10, initial mixed layer 300 K to
# 600 m capped by 6 K/km. Every surface column computes its own
# Monin–Obukhov fluxes through the SurfaceExchange contract
# (examples/validation/patchy_surface/driver.jl). Thirteen runs:
#
#  A_*  50 m resolution, 3.2 × 1.6 × 1.6 km, 2 h (statistics over the
#       second hour): resolved strips (λ = 0.8 and 3.2 km), the tiled
#       mosaic in every column, the uniform mean-temperature surface (the
#       parameter aggregate) — calm, and with a 5 m/s geostrophic wind
#       across the strips (f = 1e-4 s⁻¹);
#  B_*  100 m resolution, 12.8 × 1.6 × 1.6 km, 3 h (the last 1.5 h):
#       λ = 0.8 … 12.8 km, i.e. λ/z_i ≈ 0.8 … 11 (Patton, Sullivan & Moeng
#       2005), and the uniform surface.
#
#   julia --project=. examples/validation/patchy_surface_les.jl          # all, then tables and figures
#   julia --project -m Aeolus run examples/validation/configs/patchy_surface.toml --member A_tiled
#
# The runs are independent: start one process per member (--member) to
# run them in parallel.

[run]
driver = "patchy_surface"
name = "patchy_surface"
seed = 1

[grid]
size = [64, 32, 32]
extent = [3200.0, 1600.0, 1600.0]

[surface]
t_hot = 310.0
t_cool = 300.0
z0m = 0.1

[initial]
theta0 = 300.0
z_inv = 600.0
lapse = 0.006

[stepper]
end_time = 7200.0
dt = 3.0
average_from = 3600.0
sample_every = 5

[[sweep.member]]
label = "A_uniform"
surface = { wavelength = 800.0, t_hot = 305.0, t_cool = 305.0 }

[[sweep.member]]
label = "A_strips_800"
surface = { wavelength = 800.0 }

[[sweep.member]]
label = "A_strips_3200"
surface = { wavelength = 3200.0 }

[[sweep.member]]
label = "A_tiled"
surface = { wavelength = 800.0, mode = "tiled" }

[[sweep.member]]
label = "A_windy_uniform"
surface = { wavelength = 3200.0, t_hot = 305.0, t_cool = 305.0 }
initial = { u_g = 5.0 }
dynamics = { f_coriolis = 1e-4 }

[[sweep.member]]
label = "A_windy_strips_3200"
surface = { wavelength = 3200.0 }
initial = { u_g = 5.0 }
dynamics = { f_coriolis = 1e-4 }

[[sweep.member]]
label = "A_windy_tiled"
surface = { wavelength = 3200.0, mode = "tiled" }
initial = { u_g = 5.0 }
dynamics = { f_coriolis = 1e-4 }

[[sweep.member]]
label = "B_strips_800"
surface = { wavelength = 800.0 }
grid = { size = [128, 16, 16], extent = [12800.0, 1600.0, 1600.0] }
stepper = { end_time = 10800.0, dt = 5.0, average_from = 5400.0, sample_every = 3 }

[[sweep.member]]
label = "B_strips_1600"
surface = { wavelength = 1600.0 }
grid = { size = [128, 16, 16], extent = [12800.0, 1600.0, 1600.0] }
stepper = { end_time = 10800.0, dt = 5.0, average_from = 5400.0, sample_every = 3 }

[[sweep.member]]
label = "B_strips_3200"
surface = { wavelength = 3200.0 }
grid = { size = [128, 16, 16], extent = [12800.0, 1600.0, 1600.0] }
stepper = { end_time = 10800.0, dt = 5.0, average_from = 5400.0, sample_every = 3 }

[[sweep.member]]
label = "B_strips_6400"
surface = { wavelength = 6400.0 }
grid = { size = [128, 16, 16], extent = [12800.0, 1600.0, 1600.0] }
stepper = { end_time = 10800.0, dt = 5.0, average_from = 5400.0, sample_every = 3 }

[[sweep.member]]
label = "B_strips_12800"
surface = { wavelength = 12800.0 }
grid = { size = [128, 16, 16], extent = [12800.0, 1600.0, 1600.0] }
stepper = { end_time = 10800.0, dt = 5.0, average_from = 5400.0, sample_every = 3 }

[[sweep.member]]
label = "B_uniform"
surface = { wavelength = 800.0, t_hot = 305.0, t_cool = 305.0 }
grid = { size = [128, 16, 16], extent = [12800.0, 1600.0, 1600.0] }
stepper = { end_time = 10800.0, dt = 5.0, average_from = 5400.0, sample_every = 3 }

# The smoke size of this file for the round-trip coverage suite (test/config_roundtrip.jl,
# CFG-i #364): ignored by the loader, not part of the resolved config. Paths resolve
# against this file's directory.
[test]
overrides = [
    "grid.size=[16,8,8]",
    "stepper.end_time=60.0",
    "stepper.average_from=30.0",
]
member = "A_tiled"
