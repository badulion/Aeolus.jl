# Spectral broadening by sub-grid supersaturation fluctuations (Era IV, Phase 45, #14)
#
# The bulk moment closure (TurbulentMicrophysics) against the superdroplet
# reference with per-droplet stochastic supersaturation, and both against
# the DNS scaling σ_{r²} ∝ t^{1/2} (Sardina et al. 2015).
#
#   parcel_*      ascending parcel, w = 0.5 m/s, 300 s, 100 cm⁻³ of 5 μm
#                 droplets, ε₀ = 0.1, n_sd = 8000, for σ_S = 0, 0.1, 0.2 %;
#   stationary_*  w = 0, monodisperse 10 μm, τ = 5 s, σ_S = 0.1 %, 600 s,
#                 n_sd = 4000;
# each with the superdroplet reference (sd) and the bulk scheme (bulk).
#
#   julia --project=. examples/validation/spectral_broadening.jl

schema_version = 2

[run]
legacy = "column"
name = "spectral_broadening"

[column]
case = "droplet_parcel"

[parcel]
n_sd = 8000

[[sweep.member]]
label = "parcel_0.0"
parcel = { sigma_s = 0.0 }

[[sweep.member]]
label = "parcel_0.1"
parcel = { sigma_s = 1e-3 }

[[sweep.member]]
label = "parcel_0.2"
parcel = { sigma_s = 2e-3 }

[[sweep.member]]
label = "stationary"
parcel = { epsilon0 = 0.0, r0 = 10e-6, w = 0.0, sigma_s = 1e-3, tau = 5.0, t_end = 600.0, n_sd = 4000 }

[sweep]
axis = [ { key = "parcel.model", values = ["superdroplet", "bulk"] } ]

# The smoke size of this file for the round-trip coverage suite (test/config_roundtrip.jl,
# CFG-i #364): ignored by the loader, not part of the resolved config. Paths resolve
# against this file's directory.
[test]
overrides = [
    "parcel.t_end=20.0",
    "parcel.n_sd=400",
]
member = "parcel_0.1_superdroplet"
