# The offline 256³ filtered-DNS a-priori record (P56-c, #178; the hybrid-DNS
# decision on #208): decaying isotropic turbulence from E(k) ∝ k⁴
# exp(-2 (k/1.5)²), u' = 1, the projected SSP-RK3 of step_rk3! (2nd-order
# energy-conserving centred advection, no SGS model, CFL 0.5), run to
# t = 2 and on to 0.25 past the dissipation peak (capped at t = 6), then
# Gaussian filtered at Δ = 4h, 8h, 16h, 32h (Aeolus.ValidationRuns).
#
# ν = 1.035 · 0.018 (48/N)^{4/3} ("scaled"; 2.00e-3 at 256³): the
# fixture's scaling, which holds k_max η roughly fixed, with a 3.5 %
# margin. The 2nd-order solver needs k_max η ≥ 1.5 over the run; a run
# that misses it (or another required DNS check) fails and its record goes
# to <out>.failed only.
#
#   julia -m Aeolus run examples/validation/configs/dns256.toml                   # ≈ 36 min at -t 12, ≈ 9 GB
#   julia -m Aeolus run examples/validation/configs/dns256.toml --set grid.n=32   # the pipeline in 30 s
#   julia --project examples/validation/apriori_sgs.jl runs dns256               # its tables
#
# The record goes to output/dns_apriori.toml of the run folder. To refresh
# the fixture test/era6_apriori_sgs.jl reads, write it there:
#   julia -m Aeolus run examples/validation/configs/dns256.toml \
#         --set 'apriori.out="test/fixtures/dns256_apriori.toml"'
# (or AEOLUS_DNS256=1 for the regeneration testset). An interrupted run
# resumes bit for bit: julia -m Aeolus run <run folder> --resume.
#
# Measured (test/fixtures/dns256_apriori.toml, re-captured 2026-10-08,
# #400): 1264 steps to t = 3.85 (ε peak at t = 3.60), 1975 s of DNS with
# `julia -t 12` plus 174 s of statistics, max RSS 8.53 GB (5671 s on one
# core, 9.81 GB, on 2026-10-05 before the KernelAbstractions port).

[run]
driver = "dns"
name = "dns256"
seed = 1

[grid]
n = 256

[fluid]
nu = "scaled"
nu_margin = 1.035

[initial]
spectrum = {kind = "k4_gaussian", k_p = 1.5}

[stepper]
cfl = 0.5
end_time = 2.0
past_peak = 0.25
max_time = 6.0

[apriori]
widths = [4, 8, 16, 32]
require_checks = true

[checkpoint]
every_seconds = 1800.0          # an interrupted run resumes with --resume (see above)
keep = 2

# The smoke size of this file for the round-trip coverage suite (test/config_roundtrip.jl,
# CFG-i #364): ignored by the loader, not part of the resolved config. Paths resolve
# against this file's directory.
[test]
overrides = [
    "grid.n=32",
    "apriori.widths=[4,8]",
    "apriori.require_checks=false",
    "stepper.nsteps=10",
]
