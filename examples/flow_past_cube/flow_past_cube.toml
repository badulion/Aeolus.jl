# Coupled example 04 — flow past a cube with a tracer wake (formerly
# examples/coupled/04_flow_past_cube.jl). A 200 × 80 × 80 m channel on
# 96 × 48 × 40 (periodic in x and y, free-slip walls in z, ν = 0.1,
# Smagorinsky C_s = 0.15) with a uniform 3 m/s wind. The 20 m cube at
# x = 60–80 m, y = 30–50 m is in the static driver input/flow_past_cube_static.nc
# (made by AeolusPrep.jl from its data/obstacles/flow_past_cube.geojson) and enters as an IBM penalty
# (τ = 3 dt). A tracer is emitted behind the cube's leeward face at 17 m
# and decays over 30 s; its wake shows the recirculation. 40 s.
#
#   julia --project -m AeolusPrep static <aeolus>/examples/flow_past_cube/flow_past_cube.toml \
#       --source data/obstacles/flow_past_cube.geojson    # in AeolusPrep.jl: (re)makes the static driver
#   julia --project -m Aeolus run examples/flow_past_cube/flow_past_cube.toml
#   julia --project=. examples/flow_past_cube/plot_flow_past_cube.jl runs/<date>_flow_past_cube_<id>

schema_version = 2
static_driver = "input/flow_past_cube_static.nc"

[run]
name = "flow_past_cube"

[grid]
size = [96, 48, 40]
extent = [200.0, 80.0, 80.0]

[dynamics]
nu = 0.1
theta0 = 0.0                    # no buoyancy

[boundaries]
z = "free_slip"

[sgs]
closure = "smagorinsky"
c_s = 0.15

[initial]
u = { kind = "constant", value = 3.0 }

[obstacles]
enabled = true
penalty_time = 3.0

[tracer]
enabled = true
decay_time = 30.0
# the leeward face: cells 39–40 in x, 19–30 in y, level 9 (z = 17 m)
sources = { leeward = { x = [79.5, 83.5], y = [30.0, 50.0], z = [16.0, 18.0], rate = 1.0 } }

[time]
scheme = "euler"
dt = 0.10416666666666667        # 0.15 Δx / 3 m/s
duration = 40.0

[output]
variables = ["u", "tracer"]
cadence = 40.0

[logging]
diagnostics_cadence = 4.0

[checks]                        # results.toml; aeolus run exits with 3 if a required check fails
finite = { required = true }    # the sanity check: no NaN or Inf in the state

[test]
overrides = ["time.duration=\"none\"", "time.nsteps=10"]
