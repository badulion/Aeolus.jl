# Kernel demo 05 — pollutant plume from a point source (formerly
# examples/kernels/05_pollution_plume.jl): a passive tracer with a
# first-order decay of 60 s, emitted at 1 s⁻¹ into one cell near the
# ground 20 m from the west edge, carried by a uniform 5 m/s westerly in a
# periodic 200 × 150 × 100 m box (64 × 48 × 8, ν = 1e-3, Smagorinsky
# C_s = 0.15). 30 s; the plot is the tracer at the emission height.
#
#   julia --project -m Aeolus run examples/kernels/configs/pollution_plume.toml
#   julia --project=. examples/kernels/plot_pollution_plume.jl runs/<date>_pollution_plume_<id>

schema_version = 2

[run]
name = "pollution_plume"

[grid]
size = [64, 48, 8]
extent = [200.0, 150.0, 100.0]

[dynamics]
nu = 0.001
theta0 = 0.0                    # no buoyancy

[boundaries]
z = "periodic"

[sgs]
closure = "smagorinsky"
c_s = 0.15

[initial]
u = { kind = "constant", value = 5.0 }

[tracer]
enabled = true
decay_time = 60.0
# the cell (6, 24, 4): centre (17.2, 73.4, 43.75) m
sources = { stack = { x = [16.0, 18.0], y = [72.0, 75.0], z = [40.0, 45.0], rate = 1.0 } }

[time]
scheme = "euler"
dt = 0.1875                     # 0.3 Δx / 5 m/s
duration = 30.0

[output]
variables = ["tracer"]
cadence = 30.0

[logging]
diagnostics_cadence = 3.0

[checks]                        # results.toml; aeolus run exits with 3 if a required check fails
finite = { required = true }    # the sanity check: no NaN or Inf in the state

[test]
overrides = ["time.duration=\"none\"", "time.nsteps=10"]
