# Kernel demo 03 — neutral channel flow (formerly
# examples/kernels/03_channel_flow.jl): periodic in x and y, free-slip walls
# in z, 16 × 16 × 32 on the unit cube, ν = 5e-4 with Smagorinsky-Lilly
# (C_s = 0.17, Pr_t = 1/3). A uniform u = 1 with 5 % uniform noise on u, v
# and w relaxes for t = 2; the plot shows the plane-mean ⟨u⟩(z).
#
#   julia --project -m Aeolus run examples/kernels/configs/channel_flow.toml
#   julia --project=. examples/kernels/plot_channel_flow.jl runs/<date>_channel_flow_<id>
#
# The plot reads the u profile of the run's diagnostics.nc.

schema_version = 2

[run]
name = "channel_flow"
seed = 1

[grid]
size = [16, 16, 32]
extent = [1.0, 1.0, 1.0]

[dynamics]
nu = 0.0005
theta0 = 0.0                    # no buoyancy

[boundaries]
z = "free_slip"

[sgs]
closure = "smagorinsky"
c_s = 0.17
pr_t = 0.3333333333333333

[initial]
u = { kind = "constant", value = 1.0 }
velocity_perturbation = { kind = "uniform", amplitude = 0.05 }

[time]
scheme = "euler"
dt = 0.015625                   # min(0.3 Δx / 1.2, 0.4 Δz² / 2ν)
duration = 2.0

[logging]
diagnostics_cadence = 0.5

[checks]                        # results.toml; aeolus run exits with 3 if a required check fails
finite = { required = true }    # the sanity check: no NaN or Inf in the state

[test]
overrides = ["time.duration=\"none\"", "time.nsteps=10"]
