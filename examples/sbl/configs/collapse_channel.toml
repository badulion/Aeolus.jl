# Turbulence collapse in the flux-cooled half channel (P58-e, #193): the
# neutral half channel of P54-d (half_channel_case, 2πH × 2πH × H,
# -∂p/∂x = u*²/H, z0/H = 1e-4) with a prescribed surface cooling of
# heat_flux_fraction × the maximum sustainable heat flux (Van de Wiel et
# al. 2012) of the neutral state at the wall model's height Δz/2 = H/64,
# the flux-prescribed MOST wall law (Businger-Dyer/Beljaars-Holtslag) and
# Smagorinsky C_s = 0.1 with the Brown et al. (1994) correction and
# isotropic length scales (the Laplacian SGS form of half_channel_case).
# A neutral run is spun up for spinup_time H/u*; from its state the cooling
# is switched on and the run continues for end_time H/u*. Statistics
# (resolved TKE, lowest third, first-level wind, wall stress) every
# averaging.interval from averaging.from. examples/sbl/collapse_channel.jl
# sweeps heat_flux_fraction.

schema_version = 2

[run]
legacy = "sbl"
name = "collapse_channel"
seed = 1

[case]
kind = "collapse_channel"
heat_flux_fraction = 0.5
z0 = 1e-4
theta_ref = 300.0
spinup_time = 10.0

[grid]
size = [16, 16, 32]

[sgs]
closure = "smagorinsky"
c_s = 0.1
stability = "brown94"
stress = "laplacian"

[stepper]
end_time = 20.0

[averaging]
from = 15.0
interval = 1.0

# The smoke size of this file for the round-trip coverage suite (test/config_roundtrip.jl,
# CFG-i #364): ignored by the loader, not part of the resolved config. Paths resolve
# against this file's directory.
[test]
overrides = [
    "grid.size=[16,16,32]",
    "case.spinup_time=0.1",
    "stepper.end_time=0.15",
    "averaging.from=0.1",
    "averaging.interval=0.05",
]
