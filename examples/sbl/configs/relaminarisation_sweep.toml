# Relaminarisation of the flux-cooled open channel (P59-e, #195): h/L ∈
# {0.3, 0.6, 1, 1.5, 2} at Re_τ = 180 (32³) and 360 (48³), the runs whose
# collapse classification gives the critical h/L that
# examples/sbl/relaminarisation_channel.jl compares with Nieuwstadt (2005)
# and Flores & Riley (2011) (the table on docs/src/theory/transition.md).
# relaminarisation.toml: a neutral spin-up of 10 h/u_τ, then 20 h/u_τ
# cooled; one run folder per member, each with its own spin-up (the
# spin-up does not depend on h/L).
#
#   julia --project -m Aeolus run examples/sbl/configs/relaminarisation_sweep.toml
#   julia --project -m Aeolus run examples/sbl/configs/relaminarisation_sweep.toml --member re180_2.0
#   julia --project examples/sbl/relaminarisation_channel.jl runs/relaminarisation_*

[run]
driver = "sbl"
name = "relaminarisation"
seed = 1

[case]
kind = "relaminarisation_channel"
re_tau = 180.0
h_over_l = 1.0
spinup_time = 10.0

[grid]
size = [32, 32, 32]

[sgs]
closure = "sigma"
stability = "brown94"
stress = "symmetric"

[stepper]
end_time = 20.0

[averaging]
interval = 0.5

[sweep]
axis = [ { key = "case.h_over_l", values = [0.3, 0.6, 1.0, 1.5, 2.0] } ]

[[sweep.member]]
label = "re180"
case = { re_tau = 180.0 }
grid = { size = [32, 32, 32] }

[[sweep.member]]
label = "re360"
case = { re_tau = 360.0 }
grid = { size = [48, 48, 48] }

[test]
overrides = [
    "grid.size=[16,16,16]",
    "case.spinup_time=0.1",
    "stepper.end_time=0.15",
    "averaging.interval=0.05",
]
member = "re180_2.0"
