# Turbulence collapse in the flux-cooled half channel (P58-e, #193): the
# cooling in units of the maximum sustainable heat flux at the wall
# model's height, H/H_max(wall) ∈ {0 (neutral), 0.0159, 0.0636, 0.25, 0.5,
# 1, 2}. collapse_channel.toml (16 × 16 × 32, a neutral spin-up of
# 10 H/u*, then 20 H/u*, statistics from 15); one run folder per member,
# each with its own spin-up (the spin-up does not depend on the cooling).
# examples/sbl/collapse_channel.jl prints the table quoted on
# docs/src/theory/turbulence_stability.md ("Maximum sustainable heat flux").
#
#   julia --project -m Aeolus run examples/sbl/configs/collapse_channel_sweep.toml
#   julia --project examples/sbl/collapse_channel.jl runs/collapse_channel_*

[run]
driver = "sbl"
name = "collapse_channel"
seed = 1

[case]
kind = "collapse_channel"
heat_flux_fraction = 0.5
z0 = 1e-4
theta_ref = 300.0
spinup_time = 10.0

[grid]
size = [16, 16, 32]

[sgs]
closure = "smagorinsky"
c_s = 0.1
stability = "brown94"
stress = "laplacian"

[stepper]
end_time = 20.0

[averaging]
from = 15.0
interval = 1.0

[sweep]
axis = [ { key = "case.heat_flux_fraction", values = [0.0, 0.0159, 0.0636, 0.25, 0.5, 1.0, 2.0] } ]

[test]
overrides = [
    "grid.size=[16,16,32]",
    "case.spinup_time=0.1",
    "stepper.end_time=0.15",
    "averaging.from=0.1",
    "averaging.interval=0.05",
]
member = "2.0"
