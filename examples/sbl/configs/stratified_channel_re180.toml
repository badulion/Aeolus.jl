# The wall-resolved, stably stratified plane channel of García-Villalba &
# del Álamo (2011, Phys. Fluids 23, 045104) at Re_τ = 180 on 2πδ × πδ × 2δ
# (fixed by stratified_channel_case): no-slip walls, isothermal θ walls
# (the top hotter), friction Richardson number Ri_τ = gΔθδ/(θ₀u_τ²),
# Pr = 0.71, driven by a constant pressure gradient (u_τ = δ = 1); the
# plane-averaged dynamic Smagorinsky closure (Germano et al. 1991) with the
# Brown et al. (1994) correction (anisotropic length scales) or without it
# (sgs.stability = "none"), stress-form momentum divergence. As in the DNS
# the stratification is switched on in a developed neutral channel: a
# neutral spin-up of spinup_time δ/u_τ, then the run to end_time,
# statistics from averaging.from. Times in δ/u_τ.
# DNS: examples/sbl/data/stratified_channel_gv11_re180.csv.

[run]
driver = "sbl"
name = "stratified_channel_re180"
seed = 1

[case]
kind = "stratified_channel"
richardson = 18.0
spinup_time = 10.0

[grid]
size = [32, 32, 48]

[sgs]
closure = "dynamic_smagorinsky"
stability = "brown94"
stress = "symmetric"

[stepper]
end_time = 40.0

[averaging]
from = 20.0

# The smoke size of this file for the round-trip coverage suite (test/config_roundtrip.jl,
# CFG-i #364): ignored by the loader, not part of the resolved config. Paths resolve
# against this file's directory.
[test]
overrides = [
    "grid.size=[24,16,32]",
    "case.spinup_time=0.1",
    "stepper.end_time=0.15",
    "averaging.from=0.1",
]
