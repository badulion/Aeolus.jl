# GABLS1 with three SGS stability corrections (P55-f, #191): gabls1.toml as
# a sweep, one run folder per member: Smagorinsky C_s = 0.1 with the Brown
# et al. (1994) correction, uncorrected, and with the Lilly cutoff; 64³
# (6.25 m), 9 h, the checks of hours 8-9 against the intercomparison ranges
# (examples/sbl/data/gabls1_reference.csv). examples/sbl/gabls1.jl compares
# the members and makes the figure.
#
#   julia --project -m Aeolus run examples/sbl/gabls1_closures.toml                      # every member
#   julia --project -m Aeolus run examples/sbl/gabls1_closures.toml --member none        # one member
#   julia --project -m Aeolus run --resume runs/<run folder>                                     # continue one
#   julia --project examples/sbl/gabls1.jl runs/*gabls1*                                         # table and figure

schema_version = 2

[run]
name = "gabls1"
seed = 1

[timestep]
scheme = "rk3"

[time]
dt = "adaptive"
cfl = 1.2
duration = 32400.0             # 9 h

[grid]
size = [64, 64, 64]
extent = [400.0, 400.0, 400.0]

[dynamics]
theta0 = 263.5                 # Boussinesq reference temperature of the buoyancy

[boundaries]
z = "free_slip"                # the wall stress is the surface layer's

[initial]
theta = {kind = "mixed_layer_lapse", value = 265.0, z_i = 100.0, lapse = 0.01}
u = {kind = "constant", value = 8.0}
perturbation_amplitude = 0.2   # uniform in [-0.1, 0.1] K
perturbation_depth = 50.0

[coriolis]
f = 1.39e-4

[large_scale_forcing]
u_g = 8.0
v_g = 0.0

[surface]
model = "most"
z0m = 0.1
z0h = 0.1
temperature = {kind = "cooling_rate", initial = 265.0, rate_per_hour = 0.25}
stability = {family = "businger_dyer_log_linear", beta_m = 4.8, beta_h = 7.8}
rho_cp = 1306.5                # 1.3 kg m-3 x 1005 J kg-1 K-1 near 263 K

[sgs]
model = "smagorinsky"
c_s = 0.1
pr_t = 0.3333333333333333
stability = "brown_et_al_1994" # Brown et al. (1994)
stress = "symmetric"

[sponge]
alpha_max = 0.01
z_start = 300.0
target = "geostrophic"

[output]
variables = ["u_profile", "v_profile", "theta_profile", "wind_speed_profile", "stress_profile", "heat_flux_profile",
             "u_star", "surface_wtheta", "surface_heat_flux", "obukhov_length", "bl_height", "jet_speed",
             "jet_height", "theta_2m", "wind_10m", "surface_theta"]
averaging = "mean"
cadence = 3600.0               # hourly mean profiles
series_cadence = 300.0

[checks]                       # results.toml: the intercomparison ranges of hours 8-9
finite = { required = true }
reference_file = "data/gabls1_reference.csv"
reference.u_star = { required = false, variable = "u_star", window = [28800.0, 32400.0] }
reference.surface_wtheta = { required = false, variable = "surface_wtheta", window = [28800.0, 32400.0] }
reference.surface_heat_flux = { required = false, variable = "surface_heat_flux", window = [28800.0, 32400.0] }

[checkpoint]
every_seconds = 1800.0         # an interrupted run resumes with `aeolus run --resume <run folder>`
keep = 2

[sweep]
axis = [ { key = "sgs.stability", values = ["brown_et_al_1994", "none", "lilly_cutoff"] } ]

# The smoke size of this file for the round-trip coverage suite (test/config_roundtrip.jl,
# CFG-i #364): ignored by the loader, not part of the resolved config. Paths resolve
# against this file's directory.
[test]
overrides = [
    "grid.size=[16,16,16]",
    "time.duration=\"none\"",
    "time.nsteps=10",
    "checks.reference={}",
    "checks.reference_file=\"none\"",
]
member = "lilly_cutoff"
