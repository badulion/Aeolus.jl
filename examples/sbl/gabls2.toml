# GABLS2 / CASES-99 — two diurnal cycles over Kansas (22-24 Oct 1999;
# Svensson et al. 2011; Poulos et al. 2002). Provenance of every value:
# the header of examples/sbl/data/gabls2_case.csv (CLUBB participant
# set-up, checked against Holtslag et al. 2007).
#
# From 16 LT 22 October ([time] start = 57600 s after 00 LT): U_g = (3, -9)
# m/s, f = 8.8983571e-5 s⁻¹ (2Ω sin 37.6°), z0m = 0.03 m, z0h = 0.003 m, the
# CLUBB θ sounding, the log-linear surface functions with β = 5,
# perturbations ±0.1 K and ±0.5 m/s in u, v below 200 m (spun up from rest
# in the afternoon, the velocity projected), dry. The dynamic driver
# (input/gabls2_dynamic.nc, made from the case table by the former sbl run
# type) holds the prescribed surface temperature (the case formula sampled
# every minute, as θ with p_s = 972 hPa) and the large-scale subsidence on θ
# from 40 h local time (w_s = -0.005 z/1000 m/s below 1 km, -0.005 above;
# a 1 s linear ramp so the step means integrate it exactly; #248).
#
# The checks compare the end of the first night (30 h) with the SCM ranges
# and night 2 (48 h) with the LES screen values (data/gabls2_checks.csv).
#
#   julia --project -m Aeolus run examples/sbl/gabls2.toml

schema_version = 2
dynamic_driver = "input/gabls2_dynamic.nc"

[run]
name = "gabls2"
seed = 1

[timestep]
scheme = "rk3"

[time]
dt = "adaptive"
cfl = 1.2
start = 57600.0                # 16 LT 22 Oct (s after 00 LT)
duration = 172800.0            # to 64 h local: 00 LT 25 Oct

[grid]
size = [48, 48, 80]
extent = [2400.0, 2400.0, 1600.0]

[dynamics]
theta0 = 288.0

[boundaries]
z = "free_slip"

[initial]
theta = {kind = "table", z = [0.0, 200.0, 850.0, 900.0, 1000.0, 2000.0, 3500.0, 4000.0], values = [288.0, 286.0, 286.0, 288.0, 292.0, 300.0, 310.0, 312.0]}
u = {kind = "constant", value = 3.0}
v = {kind = "constant", value = -9.0}
perturbation_amplitude = 0.2   # uniform in [-0.1, 0.1] K
perturbation_depth = 200.0
velocity_perturbation = {kind = "uniform", amplitude = 1.0, depth = 200.0, components = ["u", "v"], project = true}

[coriolis]
f = 8.8983571e-5

[large_scale_forcing]
u_g = 3.0
v_g = -9.0
subsidence = true

[surface]
model = "most"
z0m = 0.03
z0h = 0.003
temperature = {kind = "driver"}
stability = {family = "businger_dyer_log_linear", beta = 5.0}
rho_cp = 1194.0703526801676    # 97200/(287.05 × 285) × 1005

[sgs]
model = "smagorinsky"
c_s = 0.1
pr_t = 0.3333333333333333
stability = "brown_et_al_1994"
stress = "symmetric"

[sponge]
alpha_max = 0.01
z_start = 1200.0               # 0.75 Lz
target = "geostrophic"

[output]
variables = ["u_profile", "v_profile", "theta_profile", "wind_speed_profile", "stress_profile", "heat_flux_profile",
             "u_star", "surface_wtheta", "surface_heat_flux", "obukhov_length", "bl_height", "jet_speed",
             "jet_height", "inversion_height", "theta_2m", "wind_10m", "surface_temperature"]
averaging = "mean"
cadence = 3600.0
series_cadence = 600.0

[checks]                       # results.toml: the SCM ranges at 30 h, the LES screen values at 48 h
finite = { required = true }
reference_file = "data/gabls2_checks.csv"
reference.scm_heat_flux_30 = { required = false, variable = "surface_heat_flux", window = [106200.0, 109800.0] }
reference.scm_u_star_30 = { required = false, variable = "u_star", window = [106200.0, 109800.0] }
reference.scm_h_30 = { required = false, variable = "bl_height", window = [106200.0, 109800.0] }
reference.les_theta2m_48 = { required = false, variable = "theta_2m", window = [172500.0, 172800.0] }
reference.les_U10_48 = { required = false, variable = "wind_10m", window = [172500.0, 172800.0] }

[checkpoint]
every_seconds = 1800.0         # an interrupted run resumes with `aeolus run --resume <run folder>`
keep = 2

# The smoke size of this file for the round-trip coverage suite (test/config_roundtrip.jl,
# CFG-i #364): ignored by the loader, not part of the resolved config. Paths resolve
# against this file's directory.
[test]
overrides = [
    "grid.size=[16,16,32]",
    "time.duration=\"none\"",
    "time.nsteps=10",
    "checks.reference={}",
    "checks.reference_file=\"none\"",
]
