# GABLS4 stage 3, experiment 3 — the very stable boundary layer over the
# Antarctic Plateau (Dome C, 11 Dec 2009; Couvreux et al. 2020, BLM 176,
# 369-400).
#
# From 10 UTC ([time] start = 36000 s after 00 UTC), the experiment-2
# ensemble-mean profiles (Table 5; data/gabls4_case.csv, table exp3), dry,
# f = 2Ω sin(-75.1°) (southern hemisphere), U_g = (1.25, 4.5) m/s,
# z0m = 1e-3 m, z0h = 1e-4 m and the log-linear surface functions β_m = 4.8,
# β_h = 7.8 that experiment 3 prescribed; u, v, θ uniform ±0.1 below 50 m
# (the velocity projected). The dynamic driver (input/gabls4_exp3_dynamic.nc,
# made from the case table by the former sbl run type) holds the official
# case file's surface temperature converted to θ with p_s = 651 hPa
# ((1000/p)^0.286, as the jax-alfa set-up). Six of the seven experiment-3
# LES ran at 1 m isotropic (Table 2); 64 × 64 × 64 on a 128 m cube is 2 m.
#
# The checks compare 16:30-17:30 UTC with the envelope of the six 1 m LES
# (data/gabls4_exp3_envelope.csv, from Table 4).
#
#   julia --project -m Aeolus run examples/sbl/gabls4_exp3.toml

schema_version = 2
dynamic_driver = "input/gabls4_exp3_dynamic.nc"

[run]
name = "gabls4_exp3"
seed = 1

[time]
scheme = "rk3"
dt = "adaptive"
cfl = 1.2
start = 36000.0                # 10 UTC
duration = 27000.0             # to 17:30 UTC

[grid]
size = [64, 64, 64]
extent = [128.0, 128.0, 128.0]

[dynamics]
theta0 = 275.0

[boundaries]
z = "free_slip"

[initial]
theta = {kind = "table", z = [0.0, 2.5, 12.7, 17.9, 33.4, 49.6, 61.2, 120.2, 150.0], values = [276.58, 276.58, 277.15, 277.34, 277.63, 277.69, 277.7, 277.71, 277.71]}
u = {kind = "table", z = [0.0, 2.5, 12.7, 17.9, 33.4, 49.6, 61.2, 120.2, 150.0], values = [0.0, 1.42, 2.07, 2.22, 2.34, 2.31, 2.3, 2.27, 2.25]}
v = {kind = "table", z = [0.0, 2.5, 12.7, 17.9, 33.4, 49.6, 61.2, 120.2, 150.0], values = [0.0, 1.62, 2.81, 3.32, 4.32, 4.64, 4.71, 4.84, 4.87]}
perturbation_amplitude = 0.2   # uniform in [-0.1, 0.1] K
perturbation_depth = 50.0
velocity_perturbation = {kind = "uniform", amplitude = 0.2, depth = 50.0, components = ["u", "v"], project = true}

[coriolis]
latitude = -75.1

[large_scale_forcing]
u_g = 1.25
v_g = 4.5

[surface_layer]
enabled = true
z0m = 1e-3
z0h = 1e-4
temperature = {kind = "driver"}
stability = {family = "businger_dyer_log_linear", beta_m = 4.8, beta_h = 7.8}
rho_cp = 957.6626330727378     # 65100/(287.05 × 238) × 1005

[sgs]
closure = "smagorinsky"
c_s = 0.1
pr_t = 0.3333333333333333
stability = "brown_et_al_1994"
stress = "symmetric"

[sponge]
alpha_max = 0.01
z_start = 96.0                 # 0.75 Lz
target = "geostrophic"

[output]
variables = ["u_profile", "v_profile", "theta_profile", "wind_speed_profile", "stress_profile", "heat_flux_profile",
             "u_star", "surface_wtheta", "surface_heat_flux", "obukhov_length", "bl_height", "jet_speed",
             "jet_height", "theta_2m", "wind_10m", "surface_temperature"]
averaging = "mean"
cadence = 1800.0               # the last record: 17:00-17:30 UTC
series_cadence = 300.0

[checks]                       # results.toml: 16:30-17:30 UTC against the 1 m LES envelope
finite = { required = true }
reference_file = "data/gabls4_exp3_envelope.csv"
reference.bl_height = { required = false, variable = "bl_height", window = [59400.0, 63000.0] }
reference.obukhov_length = { required = false, variable = "obukhov_length", window = [59400.0, 63000.0] }
reference.u_star = { required = false, variable = "u_star", window = [59400.0, 63000.0] }
reference.surface_heat_flux = { required = false, variable = "surface_heat_flux", window = [59400.0, 63000.0] }

[checkpoint]
every_seconds = 1800.0         # an interrupted run resumes with `aeolus run --resume <run folder>`
keep = 2

# The smoke size of this file for the round-trip coverage suite (test/config_roundtrip.jl,
# CFG-i #364): ignored by the loader, not part of the resolved config. Paths resolve
# against this file's directory.
[test]
overrides = [
    "grid.size=[16,16,16]",
    "time.duration=\"none\"",
    "time.nsteps=10",
    "checks.reference={}",
    "checks.reference_file=\"none\"",
]
