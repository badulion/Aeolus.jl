# smoke_digests re-recorded by KA-m (#301): the saturation vapour pressure is
# one fused exponential (a named one-time change, docs/src/design/ka_port.md);
# the 13 child fields moved in the last bits, the nest parent did not.
# KA-l (#304): the same 13 digests re-captured for the dual-strain gather
# (named one-time change, docs/src/design/ka_port.md); with the old scatter
# swapped back in, all 22 equal the KA-m capture.
# N-inflow-e (#268): the synthetic inflow turbulence is on by default in the
# nested case; the same 13 child digests re-captured (the parent's 6 and the
# three zero tracers did not move: the nest is one-way). With
# physics.inflow_turbulence = false the 22 digests are the KA-l capture.
# NEST-p3 (#483): the 22 digests re-captured. The nest parent is a [[domain]]
# of the model's core (berlin_smoke.toml): its forcing takes the step's mean
# clock and its Coriolis term and sponge are components (round-off against
# ParentCase, 3e-9 K in θ over six coarse steps), its tiles are its static
# driver's (AeolusPrep.jl, the site's classes under its footprint), and the
# root's last window lands on the run's end (the site takes 11 steps, not 15,
# in the parent's 8 windows: ParentCase overshot 24 s and the site halved its
# last steps to stop there). The previous capture is in git history.
# #489: the 13 child digests re-captured on one BLAS thread (the suite's
# BLAS.set_num_threads(1), test/runtests.jl; test/run.jl's workers run
# OPENBLAS_NUM_THREADS=1). The NEST-p3 capture was taken at the machine's
# default BLAS thread count, and the site's radiosity LU rounds differently
# per BLAS thread count; the parent's 6 and the 3 zero tracers did not move.
