# A small synthetic city for the urban site's tests (test/urban_run.jl,
# EX-a #438, ONE-e #454): 200 m × 200 m × 100 m on 16 × 16 × 16 cells
# (12.5 m × 6.25 m), periodic sides (no nest), at local noon on the default
# date, the idealised initial profile (an inversion at 60 m). The ground: its
# static driver (input/small_city_static.nc), which AeolusPrep.jl makes from
# its small_city.geojson in mesh metres — a 40 m and a 20 m building (a 5 m
# shed below the 8 m minimum height is dropped), a park and a pond. The
# urban components: the default provider of every urban slot and every
# additive component but the nest, at their default options.

schema_version = 2

static_driver = "input/small_city_static.nc"

[run]
name = "small_city"

[output]
# the variables of the output catalogue the run writes; none: no NetCDF file
variables = []
cadence = 12.0

[time]
dt = 2.0
duration = "none"
nsteps = 6

[grid]
size = [16, 16, 16]
extent = [200.0, 200.0, 100.0]
halo = [3, 3, 3]

[dynamics]
nu = 2.0
theta0 = 293.0

[urban]
enabled = true
start_h = 12.0
radiation_period = 8.0
soil_period = 4.0
theta_inversion_z = 60.0

[core]
model = "boussinesq"
[timestep]
scheme = "adaptive"
[pressure]
solver = "cosine_fft"
[momentum_advection]
scheme = "centered"
[scalar_advection]
model = "advection_schemes"
[sgs]
model = "tke"
[surface_exchange]
model = "most"
[ground]
model = "soil_column"
[surface_radiation]
model = "radiosity"
[column_radiation]
model = "twostream"
[buildings]
model = "citymean"
[glazing]
model = "glass_class"
[chemistry]
scheme = "aq_chem"
[microphysics]
scheme = "kessler"
[immersed_boundary]
method = "direct_forcing"

[cloud_shadow]
enabled = true
[fog_dew]
enabled = true
[geostrophic]
enabled = true
[inflow_turbulence]
enabled = true
[moist_buoyancy]
enabled = true
[pollutant]
enabled = true
[sw_modifiers]
enabled = true
[traffic_heat]
enabled = true
[turbulence_diag]
enabled = true
[veg_drag]
enabled = true
[wall_model_facades]
enabled = true
