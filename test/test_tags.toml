# Test tags (#316): weight, exclusivity and measured time for the files that
# test/runtests.jl includes. runtests.jl's include list stays the single
# list of test files; this table only annotates it.
#
#   weight    = "light" (default) | "heavy" (started first by test/run.jl)
#   exclusive = false (default) | true: run alone after the parallel batch
#               (timing-sensitive files: wall-clock or CI-budget assertions)
#   seconds   = measured wall time, orders the parallel batch (longest first)
#   reason    = optional, one line
#
# An untagged file is light and not exclusive, so a PR that adds a test file
# needs no edit here. "runtests.jl" names the inline @testsets of
# runtests.jl itself. Validation runs are not here: they are a separate
# suite, validation/ (validation/validation_tags.toml).
#
# Times: test/run.jl, 8 jobs x 1 thread, 1-min load 5-13 on the 24-core
# machine (2026-10-06).

# --- timing-sensitive ---------------------------------------------------------

["thread_invariance.jl"]
exclusive = true
reason = "with AEOLUS_THREAD_TESTS=1 it starts julia -t 1/4/24 subprocesses; the -t 24 ones would compete with the parallel jobs for every core, so it runs alone"

# --- heavy (started first) ----------------------------------------------------

["urban_checks.jl"]
weight = "heavy"
seconds = 204
reason = "the 49-run Berlin smoke matrix (12 steps each, ledgers closed); measured alone 2026-10-07, when it was part of the full-tier urban_checks.jl"

["era2_nest_hierarchy.jl"]
weight = "heavy"
seconds = 90

["era6_tke.jl"]
weight = "heavy"
seconds = 53

["era5_anthropogenic_heat.jl"]
weight = "heavy"
seconds = 47

["era6_stratified_sgs.jl"]
weight = "heavy"
seconds = 45
