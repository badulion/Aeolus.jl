# Test tags (#316): tier, weight and exclusivity for the files that
# test/runtests.jl includes. runtests.jl's include list stays the single
# list of test files; this table only annotates it.
#
#   tier      = "fast" (default; runs in both tiers) | "full" (full tier only)
#   weight    = "light" (default) | "heavy" (started first by test/run.jl)
#   exclusive = false (default) | true: run alone after the parallel batch
#               (timing-sensitive files: wall-clock or CI-budget assertions)
#   seconds   = measured wall time, orders the parallel batch (longest first)
#   reason    = one line, required for tier = "full": why the file is full-only
#               and which fast file keeps its module covered
#
# An untagged file is fast, light and not exclusive, so a PR that adds a
# test file needs no edit here. "runtests.jl" names the inline @testsets
# of runtests.jl itself.
#
# Times: AEOLUS_TEST_TIER=full test/run.jl, 8 jobs x 1 thread, 1-min load
# 5-13 on the 24-core machine (2026-10-06). Every src module keeps fast
# coverage (checked by grepping each module's name and exports in the fast
# files). PRs need the fast tier green; the merge train runs the full tier.

