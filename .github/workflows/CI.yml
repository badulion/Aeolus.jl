# Tests (#354) on every PR and push to master: test/run.jl, the PR gate.
# Validation runs (validation/run.jl) weekly and on demand; they are not a
# gate (docs/src/testing.md, docs/src/validation.md).
name: CI

on:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: '17 3 * * 1'   # Mondays 03:17 UTC: validation suite
  workflow_dispatch:

concurrency:
  # one run per PR / ref; a new push cancels the superseded run (not on master)
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  actions: write    # julia-actions/cache deletes stale caches
  contents: read

env:
  # GitHub-hosted ubuntu runners have 4 cores and 16 GB
  JOBS: '4'
  AEOLUS_TEST_THREADS: '1'
  # the suite already forces ESTIMATE in runtests.jl (#245); set it here too
  # so every process, including the precompile step, plans deterministically
  AEOLUS_FFTW_PLANNER: estimate
  AEOLUS_FFTW_THREADS: '1'
  JULIA_NUM_THREADS: '1'

jobs:
  test:
    name: Tests - Julia ${{ matrix.version }}
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        version: ['1.13']
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
          arch: x64
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - name: Run the tests
        run: julia --color=yes --project=. test/run.jl --outdir .testruns/ci-test
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testlogs-${{ matrix.version }}
          path: .testruns/ci-test
          retention-days: 14
          if-no-files-found: ignore

  validation:
    name: Validation - Julia ${{ matrix.version }}
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        version: ['1.13']
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
          arch: x64
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - name: Run the validation suite
        run: julia --color=yes --project=. validation/run.jl --outdir .testruns/ci-validation
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validationlogs-${{ matrix.version }}
          path: .testruns/ci-validation
          retention-days: 30
          if-no-files-found: ignore
