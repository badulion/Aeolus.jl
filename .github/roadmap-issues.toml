[[issue]]
title = "Phase 40 — P3 mass-dimension relation and predicted rime density"
milestone = "Era IV — High-fidelity clouds and microphysics"
labels = ["era-iv", "phase-40", "microphysics"]
body = """
Part of **Phase 40 — P3 microphysics**.

## Scope

The heart of the scheme: four regimes as a function of D (small spherical ice, dense nonspherical, partially rimed, graupel) with thresholds D_th, D_gr, D_cr SOLVED FOR from rime fraction and predicted density rather than tabulated. Carry q_rim and B_rim prognostically so density emerges. Sweep rime fraction 0 to 1 and show mass, density and fall speed vary continuously - no category jump. That continuity is the whole point of P3.

## Phase context

Implement the Morrison-Milbrandt P3 scheme: predicted particle properties, a single prognostic ice category with predicted rime mass and density, four-moment rain.

**Phase validation target:** comparison against P3 reference implementation on idealised cases; radar-reflectivity comparison for a squall line.

