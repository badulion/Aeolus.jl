[[issue]]
title = "Phase 40 — Gamma-function machinery and size-distribution moments"
milestone = "Era IV — High-fidelity clouds and microphysics"
labels = ["era-iv", "phase-40", "microphysics"]
body = """
Part of **Phase 40 — P3 microphysics**.

## Scope

Implement `lgamma` (Lanczos) and the incomplete gamma function (series + continued fraction), then the gamma-distribution moments P3 needs. `SpecialFunctions` does not load on every target, so these are written in-package. Validate against known values: Gamma(1)=1, Gamma(1/2)=sqrt(pi), Gamma(5)=24, and the P(a,x) limits. Everything downstream depends on these being right.

## Phase context

Implement the Morrison-Milbrandt P3 scheme: predicted particle properties, a single prognostic ice category with predicted rime mass and density, four-moment rain.

**Phase validation target:** comparison against P3 reference implementation on idealised cases; radar-reflectivity comparison for a squall line.

## Acceptance criteria

- [ ] Tests assert physics — conservation, analytic limits, published benchmarks — not merely that the code runs
- [ ] Full suite green: `julia --project=. test/runtests.jl`
- [ ] Measured validation numbers quoted in the PR body
