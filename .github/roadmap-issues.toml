[[issue]]
title = "Assert superdroplet convergence rather than a loose threshold"
milestone = "Technical debt"
labels = ["era-iv", "microphysics", "tech-debt", "validation"]
body = """
test/era4_superdroplet.jl asserts a single-seed L1 error below 0.25 against Golovin at t=3600 s. That passes for the wrong reason: it tolerates Monte-Carlo noise rather than testing correctness.

Measured properties worth asserting instead:

- The finite-N_sd BIAS converges: ~2.5% at N_sd=2^12, falling ~2.26x per 4x N_sd (about N^-0.6). It does NOT average away over seeds - holding N fixed and going from 10 to 160 seeds leaves it at ~0.03.
- The collision RATE is correct: ensemble-mean number decay matches Golovin's analytic n0*exp(-b*L*t) to <=1.3%, improving 3.4x per 4x N_sd.

Replace the threshold with these two.
## Acceptance criteria

- [ ] Tests assert physics — conservation, analytic limits, published benchmarks — not merely that the code runs
