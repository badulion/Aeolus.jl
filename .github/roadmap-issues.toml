[[issue]]
title = "Optional RRTMGP backend behind AbstractGasOptics"
milestone = "Technical debt"
labels = ["era-iii", "radiation", "tech-debt"]
body = """
Phase 32 gas optics is a band-model reconstruction (Malkmus -> Domoto), not a fit to line-by-line data, because RRTMGP.jl needs a NetCDF/HDF5 stack that does not build on every target. Broadband fluxes land within a few percent of observations.

Add an optional RRTMGP-backed implementation behind the same `AbstractGasOptics` interface, selected at run time where it loads. The interface already supports this - no core change needed.
