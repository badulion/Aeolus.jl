[[issue]]
title = "Phase 48 — Leaf-area density and implicit canopy drag"
milestone = "Era V — High-fidelity land, urban and surface exchange"
labels = ["era-v", "phase-48", "land", "tech-debt"]
body = """
Part of **Phase 48 — Resolved plant canopy**.

## Scope

Resolved canopy drag with a leaf-area-density profile, treated IMPLICITLY so it is unconditionally stable. `apply_vegetation_drag!` currently ships disabled because explicit Euler is CFL-unstable at dt = 2 s - this issue is what fixes that.

## Phase context

Resolved-canopy drag with a leaf-area-density profile, implicit treatment so it is unconditionally stable, radiation attenuation through the canopy, and leaf-energy-balance for leaf temperature.

**Phase validation target:** within-canopy wind and temperature profiles against forest-tower observations; wind-tunnel canopy-flow data.

