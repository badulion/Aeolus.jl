[[issue]]
title = "Locate the two defects the Phase 41 author named but never fixed"
milestone = "Technical debt"
labels = ["era-iv", "microphysics", "tech-debt"]
body = """
The agent that wrote `Superdroplet.jl` reported it was fixing four defects when it was cut off: "recursive constructors, a bogus blend expression, the import form, and the substep criterion".

Two were found and fixed - the import form, and a bracketing bug in the implicit growth step that collapsed growing pure-water droplets onto the floor. The **recursive constructors** and the **bogus blend expression** were never located. They may sit in untested code.

Audit the module against that description.
