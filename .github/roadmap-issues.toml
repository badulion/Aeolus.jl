[[issue]]
title = "Add an export-collision check to the test suite"
milestone = "Technical debt"
labels = ["era-iv", "infrastructure", "tech-debt"]
body = """
Name collisions across modules have been caught three times by hand, each time only when something broke: `material_albedo`/`material_emissivity` (Phases 35 vs 36), `band_wavelength` (four copies), `effective_radius` (Phases 37 vs 41). An ambiguous export makes the name silently undefined at the top level.

Add a test that scans every module's export list and fails on any name exported by two modules without a shared generic declared in a contract module.
