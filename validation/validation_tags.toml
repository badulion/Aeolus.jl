# Validation tags: weight, exclusivity, measured time and what each case
# checks, for the files that validation/runvalidation.jl includes (same
# format and runner as test/test_tags.toml; see docs/src/validation.md).
#
#   weight    = "light" (default) | "heavy" (started first)
#   exclusive = true: run alone after the parallel batch (wall-clock asserts)
#   seconds   = measured wall time, orders the parallel batch
#   reason    = one line: what the case validates and which test file keeps
#               its module tested
#
# Seconds: measured for the whole file when it was in the full test tier
# (8 jobs x 1 thread, 1-min load 5-13, 24-core machine, 2026-10-06); the
# split files are shorter now. The runner orders by its last measured times
# (.testruns/timings_validation.toml) once a validation run has recorded them.

